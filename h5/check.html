<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>H5 体检器 · 上线前 10 秒自检（基于 221 个 AI 生成 H5 实测）</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#0f1216; --bg2:#151a21; --card:#1a2028; --line:#28313d;
  --ink:#e8edf3; --ink2:#9aa8b8; --ink3:#6b7889;
  --acc:#3ddc97; --acc2:#2bb37c; --warn:#ffb454; --bad:#ff6b6b; --info:#6cb2ff;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1200px 600px at 50% -10%,#1b2530 0%,var(--bg) 55%) no-repeat,var(--bg);
  color:var(--ink); font-family:var(--sans); line-height:1.65;
  min-height:100vh; min-height:100dvh;
  -webkit-text-size-adjust:100%;
  padding:0 16px 64px;
}
.wrap{max-width:860px;margin:0 auto}
header{padding:34px 0 10px}
.brand{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--acc);
  border:1px solid rgba(61,220,151,.28);background:rgba(61,220,151,.08);
  padding:4px 10px;border-radius:999px;letter-spacing:.04em}
h1{font-size:clamp(22px,5.2vw,32px);line-height:1.3;margin:16px 0 8px;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--acc)}
.sub{color:var(--ink2);font-size:14.5px;margin:0 0 6px}
.sub b{color:var(--ink);font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:18px 0}
.panel.drop-on{border-color:var(--acc);box-shadow:0 0 0 3px rgba(61,220,151,.12)}
textarea{
  width:100%;min-height:170px;resize:vertical;border:0;outline:0;background:#0d1116;
  color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.6;
  border-radius:10px;padding:12px;border:1px solid var(--line);
}
textarea::placeholder{color:#55616f}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.btn{
  appearance:none;border:1px solid var(--line);background:#202832;color:var(--ink);
  padding:8px 13px;border-radius:9px;font-size:13.5px;cursor:pointer;font-family:inherit;
  min-height:38px;transition:border-color .15s,background .15s,transform .05s;
}
.btn:hover{border-color:#3a4757;background:#242e3a}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#06231a;font-weight:650}
.btn.primary:hover{background:#4ae5a6}
.btn.ghost{background:transparent}
.meta{margin-left:auto;font-size:12.5px;color:var(--ink3);font-family:var(--mono)}
.sum{display:flex;gap:14px;flex-wrap:wrap;align-items:center;border-radius:14px;padding:16px;
  background:linear-gradient(180deg,#1c2530,#171d25);border:1px solid var(--line);margin:20px 0 14px}
.score{font-size:34px;font-weight:750;line-height:1;letter-spacing:-.02em}
.score small{font-size:13px;font-weight:500;color:var(--ink2);margin-left:4px}
.sum .txt{flex:1;min-width:220px;font-size:14px;color:var(--ink2)}
.sum .txt b{color:var(--ink)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink2)}
.pill.bad{color:#ffb3b3;border-color:rgba(255,107,107,.35);background:rgba(255,107,107,.08)}
.pill.warn{color:#ffd8a3;border-color:rgba(255,180,84,.35);background:rgba(255,180,84,.08)}
.pill.ok{color:#a6f2cf;border-color:rgba(61,220,151,.35);background:rgba(61,220,151,.08)}
h2.sec{font-size:14px;color:var(--ink2);font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin:26px 0 10px}
.card{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:14px;margin:10px 0}
.card.bad{border-left:3px solid var(--bad)}
.card.warn{border-left:3px solid var(--warn)}
.card.info{border-left:3px solid var(--info)}
.card h3{margin:0 0 4px;font-size:15.5px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.card h3 .tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;letter-spacing:.05em}
.tag.bad{background:rgba(255,107,107,.14);color:#ff9d9d}
.tag.warn{background:rgba(255,180,84,.14);color:#ffcd8a}
.tag.info{background:rgba(108,178,255,.14);color:#a5ccff}
.card p{margin:6px 0;font-size:14px;color:var(--ink2)}
.card p.bench{font-size:12.5px;color:var(--ink3);border-top:1px dashed var(--line);padding-top:7px;margin-top:9px}
.card p.bench b{color:var(--warn);font-weight:600}
code,kbd{font-family:var(--mono);font-size:12.5px;background:#0d1116;border:1px solid var(--line);
  padding:1px 5px;border-radius:5px;color:#cfe4ff}
pre{margin:8px 0 0;background:#0d1116;border:1px solid var(--line);border-radius:9px;padding:10px;
  overflow:auto;font-family:var(--mono);font-size:12.5px;line-height:1.55;color:#bfe3d2}
pre .k{color:#ffb454}
.lines{font-size:12.5px;color:var(--ink3);font-family:var(--mono)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--ink3);font-size:14px}
footer{margin-top:34px;color:var(--ink3);font-size:12.5px;line-height:1.8;border-top:1px solid var(--line);padding-top:14px}
footer b{color:var(--ink2)}
@media(max-width:520px){
  header{padding-top:22px}
  .sum{padding:13px}
  .score{font-size:28px}
  .btn{flex:1 1 auto;text-align:center}
  .meta{width:100%;margin-left:0;text-align:right}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23f6f3ea'/%3E%3Crect x='2' y='2' width='3' height='12' fill='%238c2f2f'/%3E%3Crect x='7' y='2' width='8' height='2' fill='%231d1b18'/%3E%3Crect x='7' y='6' width='8' height='2' fill='%231d1b18'/%3E%3Crect x='7' y='10' width='5' height='2' fill='%231d1b18'/%3E%3C/svg%3E">
</head>
<body>
<div class="wrap">
  <header>
    <span class="brand">H5 体检器 · 本地运行</span>
    <h1>上线前 10 秒，查出 <em>AI 写的 H5</em> 会怎么炸</h1>
    <p class="sub">10 类静态检查，全部在浏览器里跑，<b>代码不出本机</b>。基准：我逐页体检过的 <b>221 个已上架 AI 生成 H5</b>（2026-10-24）。</p>
  </header>

  <section class="panel" id="panel">
    <textarea id="src" spellcheck="false" placeholder="把 HTML 源码粘进来，或把 .html 文件拖到这块区域……"></textarea>
    <div class="row">
      <label class="btn primary" for="file">选择 .html 文件</label>
      <input type="file" id="file" accept=".html,.htm,text/html" hidden>
      <button class="btn" id="sample" type="button">示例：问题代码</button>
      <button class="btn ghost" id="sample2" type="button">示例：修好的</button>
      <span class="meta" id="meta">等待输入…</span>
    </div>
  </section>

  <section id="out"></section>

  <footer>
    <b>数据来源</b>：2026-10-24 对某 AI 应用社区 221 个公开 H5 作品逐个抓取源码做静态体检（中位体积 20KB，中位浏览 2 次）。<br>
    <b>说明</b>：静态检查只能抓住“确定会出问题”的一类，抓不到业务逻辑错、交互设计差。体检干净 ≠ 有人用。<br>
    <b>作者</b>：林小黑 · 用 AI 写应用，也替 AI 写的应用挑错。
  </footer>
</div>

<script>
(function(){
  'use strict';

  /* ---------- 基准数据（221 个真实样本，见页脚） ---------- */
  var BASE = {
    n: 221,
    hist: {0:17, 1:130, 2:44, 3:23, 4:6, 5:1},
    rate: {
      syntax: 0,
      ls_naked: 0.0724,
      innerhtml: 0.8552,
      vh: 0.1810,
      cdn: 0.0679,
      noviewport: 0.0090,
      nocharset: 0.0090,
      nopersist: 0.1086,
      placeholder: 0.1131,
      eval: 0.0136
    }
  };

  /* ---------- 存储兜底（本工具自己先用一遍） ---------- */
  var store = (function(){
    var mem = {};
    return {
      get: function(k){
        try { var v = localStorage.getItem(k); return v === null ? (mem[k] || null) : v; }
        catch (e) { return mem[k] || null; }
      },
      set: function(k, v){
        mem[k] = v;
        try { localStorage.setItem(k, v); } catch (e) { /* 存储被禁用：只留内存副本 */ }
      },
      del: function(k){
        delete mem[k];
        try { localStorage.removeItem(k); } catch (e) { /* 同上 */ }
      }
    };
  })();

  var $ = function(id){ return document.getElementById(id); };
  var src = $('src'), out = $('out'), meta = $('meta'), panel = $('panel');

  /* ---------- 工具 ---------- */
  function lineOf(text, idx){
    var n = 1;
    for (var i = 0; i < idx && i < text.length; i++) if (text.charCodeAt(i) === 10) n++;
    return n;
  }
  function pct(x){ return Math.round(x * 100) + '%'; }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function bytes(s){ return new TextEncoder().encode(s).length; }

  /* 提取内联 script（跳过带 src 的与 type=module 的） */
  function inlineScripts(html){
    var re = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi, m, list = [];
    while ((m = re.exec(html)) !== null) {
      var attrs = m[1] || '';
      if (/\bsrc\s*=/i.test(attrs)) continue;
      list.push({ attrs: attrs, code: m[2] || '', index: m.index + m[0].indexOf(m[2]) });
    }
    return list;
  }
  function stripCode(html){
    return html.replace(/<script\b[\s\S]*?<\/script>/gi, ' ')
               .replace(/<style\b[\s\S]*?<\/style>/gi, ' ')
               .replace(/<!--[\s\S]*?-->/g, ' ');
  }

  /* 把注释、字符串、模板串、正则字面量的“内容”抹成空格（保留引号与换行，长度不变）。
     目的：扫描“真实调用”时，不把文档/示例字符串里的 localStorage、eval 当成代码。
     用状态机而不是正则，避免被代码里的引号/斜杠带偏（这条坑我自己踩过）。 */
  function stripNoise(code){
    var out = [], i = 0, n = code.length, st = 'code', cls = false;
    function lastSig(){
      for (var j = out.length - 1; j >= 0; j--) {
        if (out[j].charCodeAt(0) > 32) return out[j];
      }
      return '';
    }
    while (i < n) {
      var c = code.charAt(i), c2 = code.substr(i, 2), cc = code.charCodeAt(i);
      if (st === 'code') {
        if (c2 === '//') { st = 'line'; out.push(' ', ' '); i += 2; continue; }
        if (c2 === '/*') { st = 'block'; out.push(' ', ' '); i += 2; continue; }
        if (cc === 39 || cc === 34 || cc === 96) { st = c; out.push(c); i++; continue; }
        if (c === '/') {
          var prev = lastSig();
          if (prev === '' || '()[]{},;:=!&|?+-*%<>~^'.indexOf(prev) >= 0) {
            st = 'regex'; cls = false; out.push(c); i++; continue;
          }
        }
        out.push(c); i++; continue;
      }
      if (st === 'line') {
        if (cc === 10) { st = 'code'; out.push(c); } else out.push(' ');
        i++; continue;
      }
      if (st === 'block') {
        if (c2 === '*/') { st = 'code'; out.push(' ', ' '); i += 2; continue; }
        out.push(cc === 10 ? c : ' '); i++; continue;
      }
      if (st === 'regex') {
        if (cc === 92) { out.push(' ', ' '); i += 2; continue; }
        if (c === '[') cls = true;
        else if (c === ']') cls = false;
        else if (c === '/' && !cls) { st = 'code'; out.push('/'); i++; continue; }
        out.push(cc === 10 ? c : ' '); i++; continue;
      }
      if (cc === 92) { out.push(' ', ' '); i += 2; continue; }
      if (c === st) { st = 'code'; out.push(c); i++; continue; }
      out.push(cc === 10 ? c : ' '); i++;
    }
    return out.join('');
  }

  /* ---------- 检查器 ---------- */
  function check(html){
    var issues = [];
    var scripts = inlineScripts(html);
    var rawJs = scripts.map(function(s){ return s.code; }).join('\n');
    /* 有人用 window['localStorage'] 绕过检测：先把这两种引号写法还原成标识符，再抹噪声 */
    var normJs = rawJs.replace(/['"](localStorage|sessionStorage)['"]/g, '$1');
    var js = stripNoise(normJs);
    var body = stripCode(html);

    /* 1. 语法 */
    var synErr = null;
    for (var i = 0; i < scripts.length; i++) {
      var code = scripts[i].code;
      if (code.trim().length < 20) continue;
      if (/type\s*=\s*["']module/i.test(scripts[i].attrs)) continue;
      try { new Function(code); }
      catch (e) { synErr = { msg: e && e.message ? e.message : String(e), line: lineOf(html, scripts[i].index) }; break; }
    }
    if (synErr) issues.push({
      id:'syntax', sev:'bad', title:'JS 语法错误：整段脚本不会执行',
      detail:'浏览器解析到这一行就放弃整块 <code>&lt;script&gt;</code>，页面看着还在，按钮全是死的。AI 生成代码最常见的翻车方式：字符串里裸换行、少一个右括号、中文标点混进代码。',
      lines:'第 ' + synErr.line + ' 行起的 &lt;script&gt;：' + esc(synErr.msg),
      rate: BASE.rate.syntax,
      fix:'把报错行附近的引号/括号补齐；单引号字符串里不要直接换行，改用反引号模板串或 <code>\\n</code>。<br>自检命令：<code>node --check app.js</code>'
    });

    /* 2. 裸 localStorage */
    var lsRe = /(?:localStorage|sessionStorage)\s*\./g, m2, naked = [], lsTotal = 0;
    while ((m2 = lsRe.exec(js)) !== null) {
      lsTotal++;
      var back = js.slice(Math.max(0, m2.index - 400), m2.index);
      if (!/\btry\s*\{/.test(back)) naked.push(m2.index);
    }
    if (naked.length) issues.push({
      id:'ls', sev:'bad', title:'裸调 localStorage：存储被禁用时直接抛异常',
      detail:'微信内置浏览器、iOS 隐私模式、部分 App WebView 会禁用存储，<code>localStorage</code> 一碰就抛 <code>SecurityError</code>。没有 <code>try/catch</code> 就等于：后面所有代码全部不执行，用户看到的是“点了没反应”。而且不报错、不提示，最难查。',
      lines: naked.length + ' 处未包裹（共 ' + lsTotal + ' 处存储调用）',
      rate: BASE.rate.ls_naked,
      fix:'<pre>var store=(function(){var mem={};function s(f,fb){try{return f()}catch(e){return fb}}\nreturn{get:function(k){return s(function(){return localStorage.getItem(k)},mem[k]||null)},\nset:function(k,v){mem[k]=v;s(function(){localStorage.setItem(k,v)},null)}}})();</pre>'
    });

    /* 3. 动态 innerHTML */
    var ihRe = /\.innerHTML\s*\+?=\s*/g, ih = 0, m3;
    while ((ihRe.exec(js)) !== null) ih++;
    var tplRe = /\.innerHTML\s*\+?=\s*`[^`]*\$\{/g, tpl = 0;
    while ((tplRe.exec(js)) !== null) tpl++;
    if (ih) issues.push({
      id:'innerhtml', sev: tpl ? 'warn' : 'info',
      title: tpl ? '把用户输入拼进 innerHTML：一个引号就能改你的页面' : '动态 innerHTML：结构靠字符串拼，改一次崩一次',
      detail: tpl
        ? '模板串里带 <code>${}</code> 且直接赋给 <code>innerHTML</code>，只要用户能输入（备注、昵称、搜索词），就能注入标签甚至脚本。至少要用 <code>textContent</code>，需要富文本就过一遍白名单。'
        : '用字符串拼 HTML 本身不算错，但一旦有一处漏了闭合标签，整块 DOM 会错位，而且没有报错。',
      lines: ih + ' 处动态赋值' + (tpl ? '，其中 ' + tpl + ' 处含模板插值' : ''),
      rate: BASE.rate.innerhtml,
      fix:'用户内容走 <code>el.textContent = s</code>；必须渲染结构时，先 <code>escapeHtml(s)</code> 再拼。'
    });

    /* 4. 100vh */
    if (/100vh/.test(html) && !/100dvh|100svh/.test(html)) issues.push({
      id:'vh', sev:'warn', title:'只用 100vh：手机上底部会被地址栏吃掉',
      detail:'移动端 <code>100vh</code> 按“地址栏收起时”的高度算，页面一打开就比屏幕高——底部按钮被顶出可视区，用户以为坏了。',
      lines:'命中 ' + (html.match(/100vh/g) || []).length + ' 处',
      rate: BASE.rate.vh,
      fix:'<pre>height:100vh;\nheight:100dvh; /* 支持的浏览器用这个，不支持的退回上一行 */</pre>'
    });

    /* 5. 外链依赖 */
    var depRe = /(?:src|href)\s*=\s*["'](https?:\/\/[^"']+)["']/gi, m4, doms = {}, ext = 0;
    while ((m4 = depRe.exec(html)) !== null) {
      var host = (m4[1].match(/^https?:\/\/([^\/]+)/) || [,''])[1];
      if (!host || /csdn\.net$/.test(host) || /localhost|127\.0\.0\.1/.test(host)) continue;
      doms[host] = (doms[host] || 0) + 1; ext++;
    }
    var badCdn = Object.keys(doms).filter(function(h){
      return /unpkg|jsdelivr|cdnjs|tailwindcss|googleapis|gstatic|bootcdn|staticfile|skypack/.test(h);
    });
    if (badCdn.length) issues.push({
      id:'cdn', sev:'bad', title:'依赖公共 CDN：国内网络下可能一直白屏',
      detail:'<code>unpkg / jsdelivr / cdnjs / tailwind CDN / Google Fonts</code> 在国内经常超时或全挂。脚本加载失败 = 页面只剩静态壳子，用户点哪儿都没反应，而你的控制台在自己电脑上一切正常。Tailwind 的 CDN 更狠：它在浏览器里现编译 CSS，首屏必慢。',
      lines: badCdn.map(function(h){ return esc(h); }).join('、') + '（共 ' + ext + ' 个外链）',
      rate: BASE.rate.cdn,
      fix:'把依赖下载到本地，和 HTML 一起打包；或直接内联关键 CSS，别在首屏引外部样式。'
    });

    /* 6. 基础三件套 */
    var noViewport = !/<meta[^>]+name\s*=\s*["']viewport/i.test(html);
    var noCharset  = !/<meta[^>]+charset/i.test(html);
    if (noViewport || noCharset) issues.push({
      id:'meta', sev:'warn', title:'缺基础 meta：手机上字小如蚁 / 中文乱码',
      detail:'没有 <code>viewport</code>，手机浏览器按 980px 渲染再缩小，字全糊；没有 <code>charset</code>，中文可能变乱码（尤其分享到微信后）。',
      lines: [noViewport ? '缺 viewport' : '', noCharset ? '缺 charset' : ''].filter(Boolean).join(' + '),
      rate: Math.max(BASE.rate.noviewport, BASE.rate.nocharset),
      fix:'<pre>&lt;meta charset="utf-8"&gt;\n&lt;meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"&gt;</pre>'
    });

    /* 7. 无持久化 */
    if (!/localStorage|sessionStorage|indexedDB/.test(js)) issues.push({
      id:'persist', sev:'warn', title:'没有任何持久化：刷新一次，用户白干',
      detail:'打卡、记账、清单类应用如果只把数据放内存，用户切个后台回来就清空。这是“用一次就走”的头号原因——不是功能不好，是数据没了。',
      lines:'未发现 localStorage / sessionStorage / indexedDB',
      rate: BASE.rate.nopersist,
      fix:'至少落一份 <code>localStorage</code>（记得包 try/catch），进入页面先读、每次变更就写。'
    });

    /* 8. 占位符残留 */
    var ph = (body.match(/TODO|FIXME|lorem ipsum|示例数据|假数据|待实现|待补充|占位/g) || []);
    if (ph.length) issues.push({
      id:'ph', sev:'warn', title:'占位内容没删：用户一眼看出这是半成品',
      detail:'“示例数据 / TODO / 待实现”这类字样留在页面上，会直接毁掉信任。AI 生成时很爱留这些。',
      lines:'命中 ' + ph.length + ' 处：' + esc(ph.slice(0, 5).join('、')),
      rate: BASE.rate.placeholder,
      fix:'全部替换成真实文案或空状态提示（“还没有记录，点右上角添加”）。'
    });

    /* 9. eval / document.write */
    var ev = (js.match(/\beval\s*\(|document\.write\s*\(/g) || []);
    if (ev.length) issues.push({
      id:'eval', sev:'info', title:'eval / document.write：性能与安全双输',
      detail:'<code>document.write</code> 在页面加载后调用会清空整页；<code>eval</code> 会让 CSP 失效、也容易被注入。',
      lines:'命中 ' + ev.length + ' 处',
      rate: BASE.rate.eval,
      fix:'用 DOM API 或 <code>JSON.parse</code> 替代。'
    });

    /* 10. 表单未拦截默认提交 */
    if (/<form\b/i.test(body) && !/preventDefault/.test(rawJs)) issues.push({
      id:'form', sev:'bad', title:'表单没拦默认提交：点一下整页刷新',
      detail:'<code>&lt;form&gt;</code> 里按回车或点提交按钮，浏览器会把当前页当 GET/POST 发走——用户的输入瞬间清空。纯前端应用必须拦掉默认行为。',
      lines:'发现 &lt;form&gt; 但 JS 里没有 preventDefault',
      rate: 0,
      fix:'<pre>form.addEventListener("submit", function(e){ e.preventDefault(); /* 你的逻辑 */ });</pre>'
    });

    return { issues: issues, bytes: bytes(html), scripts: scripts.length };
  }

  /* ---------- 渲染 ---------- */
  function betterThan(k){
    var worse = 0, total = 0;
    for (var key in BASE.hist) { total += BASE.hist[key]; if (+key > k) worse += BASE.hist[key]; }
    return total ? Math.round(worse / total * 100) : 0;
  }

  function render(html){
    if (!html || html.trim().length < 30) { out.textContent = ''; return; }
    var r = check(html);
    var iss = r.issues;
    var order = {bad:0, warn:1, info:2};
    iss.sort(function(a, b){ return order[a.sev] - order[b.sev]; });
    var bad = iss.filter(function(x){ return x.sev === 'bad'; }).length;
    var warn = iss.filter(function(x){ return x.sev === 'warn'; }).length;
    var info = iss.length - bad - warn;
    var verdict, cls;
    if (bad) { verdict = '先别上线，有 ' + bad + ' 项会直接炸'; cls = 'bad'; }
    else if (warn) { verdict = '能上线，但有 ' + warn + ' 处会让用户走掉'; cls = 'warn'; }
    else if (info) { verdict = '基本干净，剩 ' + info + ' 项优化项'; cls = 'ok'; }
    else { verdict = '这一关全过了'; cls = 'ok'; }

    out.textContent = '';

    var sum = document.createElement('div');
    sum.className = 'sum';
    var sc = document.createElement('div');
    sc.className = 'score';
    sc.innerHTML = '';
    sc.textContent = String(iss.length);
    var sm = document.createElement('small');
    sm.textContent = ' 类问题';
    sc.appendChild(sm);

    var tx = document.createElement('div');
    tx.className = 'txt';
    var b = document.createElement('b');
    b.textContent = verdict;
    tx.appendChild(b);
    var p2 = document.createElement('div');
    p2.style.marginTop = '3px';
    p2.textContent = r.bytes.toLocaleString() + ' 字节 · ' + r.scripts + ' 段内联脚本 · 比 ' + betterThan(iss.length) + '% 的同类样本干净';
    tx.appendChild(p2);

    var pills = document.createElement('div');
    pills.className = 'pills';
    [[bad, 'bad', '会炸'], [warn, 'warn', '会掉人'], [info, 'info', '优化']].forEach(function(t){
      if (!t[0]) return;
      var el = document.createElement('span');
      el.className = 'pill ' + t[1];
      el.textContent = t[2] + ' ' + t[0];
      pills.appendChild(el);
    });
    tx.appendChild(pills);

    sum.appendChild(sc);
    sum.appendChild(tx);
    out.appendChild(sum);

    if (!iss.length) {
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = '没有命中任何一类已知硬伤。不过记住：静态检查干净，只说明“不会崩”，不等于“有人用”。';
      out.appendChild(e);
    }

    iss.forEach(function(it){
      var c = document.createElement('div');
      c.className = 'card ' + it.sev;
      var h = document.createElement('h3');
      var tag = document.createElement('span');
      tag.className = 'tag ' + it.sev;
      tag.textContent = it.sev === 'bad' ? '会炸' : it.sev === 'warn' ? '会掉人' : '优化';
      var t = document.createElement('span');
      t.textContent = it.title;
      h.appendChild(tag);
      h.appendChild(t);
      c.appendChild(h);

      var d = document.createElement('p');
      d.innerHTML = it.detail;
      c.appendChild(d);

      var l = document.createElement('div');
      l.className = 'lines';
      l.innerHTML = it.lines;
      c.appendChild(l);

      var fx = document.createElement('p');
      fx.className = 'bench';
      var rateTxt = it.rate ? '同类样本里 <b>' + pct(it.rate) + '</b> 也有这条 —— ' : '';
      fx.innerHTML = rateTxt + '修法：' + it.fix;
      c.appendChild(fx);

      out.appendChild(c);
    });

    meta.textContent = iss.length + ' 项 · ' + r.bytes.toLocaleString() + 'B';
  }

  /* ---------- 事件 ---------- */
  var t = null;
  function schedule(){
    if (t) clearTimeout(t);
    t = setTimeout(function(){ render(src.value); }, 220);
  }
  src.addEventListener('input', schedule);

  $('file').addEventListener('change', function(ev){
    var f = ev.target.files && ev.target.files[0];
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function(){ src.value = String(fr.result || ''); schedule(); };
    fr.readAsText(f);
  });

  ['dragenter','dragover'].forEach(function(n){
    panel.addEventListener(n, function(e){ e.preventDefault(); panel.classList.add('drop-on'); });
  });
  ['dragleave','drop'].forEach(function(n){
    panel.addEventListener(n, function(e){ e.preventDefault(); panel.classList.remove('drop-on'); });
  });
  panel.addEventListener('drop', function(e){
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function(){ src.value = String(fr.result || ''); schedule(); };
    fr.readAsText(f);
  });

  var SAMPLE_BAD = '<!DOCTYPE html>\n<html>\n<head><title>记账</title></head>\n<body>\n<div style="height:100vh;width:1200px">\n  <h1>我的记账本（示例数据）</h1>\n  <input id="amt"><button onclick="add()">记一笔</button>\n  <ul id="list"></ul>\n</div>\n<script>\nvar data = [];\nfunction add(){\n  data.push(document.getElementById(\'amt\').value);\n  localStorage.setItem(\'rec\', JSON.stringify(data));\n  document.getElementById(\'list\').innerHTML += \'<li>\' + document.getElementById(\'amt\').value + \'</li>\';\n}\nload();\nfunction load(){ data = JSON.parse(localStorage.getItem(\'rec\') || \'[]\'); }\n<\/script>\n</body>\n</html>';

  var SAMPLE_OK = '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">\n<title>我的记账本</title>\n<style>\nbody{margin:0;font-family:system-ui;max-width:560px;margin:0 auto;padding:16px;\n     min-height:100vh;min-height:100dvh}\nli{list-style:none;padding:10px 0;border-bottom:1px solid #eee}\n</style>\n</head>\n<body>\n<h1>我的记账本</h1>\n<form id="f"><input id="amt" inputmode="decimal" aria-label="金额"><button>记一笔</button></form>\n<ul id="list"></ul>\n<script>\n(function(){\n  "use strict";\n  var mem = {};\n  function s(f, fb){ try { return f(); } catch(e){ return fb; } }\n  var store = {\n    get: function(k){ return s(function(){ return localStorage.getItem(k); }, mem[k] || null); },\n    set: function(k, v){ mem[k] = v; s(function(){ localStorage.setItem(k, v); }, null); }\n  };\n  var data = [];\n  try { data = JSON.parse(store.get("rec") || "[]"); } catch(e){ data = []; }\n  function draw(){\n    var ul = document.getElementById("list");\n    ul.textContent = "";\n    data.forEach(function(v){\n      var li = document.createElement("li");\n      li.textContent = v;      /* 用户内容只用 textContent */\n      ul.appendChild(li);\n    });\n  }\n  document.getElementById("f").addEventListener("submit", function(e){\n    e.preventDefault();\n    var el = document.getElementById("amt");\n    var v = el.value.trim();\n    if (!v) return;\n    data.push(v);\n    store.set("rec", JSON.stringify(data));\n    el.value = "";\n    draw();\n  });\n  draw();\n})();\n<\/script>\n</body>\n</html>';

  $('sample').addEventListener('click', function(){ src.value = SAMPLE_BAD; render(src.value); });
  $('sample2').addEventListener('click', function(){ src.value = SAMPLE_OK; render(src.value); });

  store.set('h5checker_seen', '1');
  var last = store.get('h5checker_last');
  if (last) { src.value = last; render(last); }
  src.addEventListener('input', function(){ store.set('h5checker_last', src.value.slice(0, 20000)); });
})();
</script>
</body>
</html>
